[package]
name = "neuroforensics-ai"
version = "0.1.0"
edition = "2021"
description = "NEUROFORENSICS AI — AI-Powered CPU & GPU Forensic Analyzer for MEMO Collector .AIF case files"
readme = "README.md"

[dependencies]
# GUI
eframe = "0.33"
egui = "0.33"
rfd = "0.15"

# Serialization / hashing
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Case workspace database
rusqlite = { version = "0.31", features = ["bundled"] }

# AIF container access (ZIP-based evidence container, streamed per entry)
zip = { version = "0.6", default-features = false, features = ["deflate"] }

# Search
regex = "1"

# Reporting
printpdf = "0.7"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[profile.release]
lto = true
strip = true
