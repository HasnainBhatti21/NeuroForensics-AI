[package]
name = "memo-collector"
version = "1.0.0"
edition = "2021"
description = "MEMO Collector - Portable forensic evidence acquisition tool (NEUROFORENSICS AI)"
authors = ["NEUROFORENSICS AI"]
license = "MIT"
build = "build.rs"

[[bin]]
name = "MEMOCollector"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.35"
winreg = "0.52"
wmi = "0.14"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
] }

[lib]
name = "memo_collector"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
